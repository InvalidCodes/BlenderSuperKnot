name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The tested layer is pure Python: no Blender, no MuJoCo.
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m superknot variants trefoil figure_eight
